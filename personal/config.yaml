# gpt-image-2.5-sunburst — best editing precision, holds the reference style tightest
# gpt-image-2.5-flare    — faster and cheaper, slightly looser style match
model: gpt-image-2.5-sunburst

# Avatars are square. 1024x1024 is the square size these models take.
size: 1024x1024

# low | medium | high | xhigh | max. "high" is the sane default — xhigh and max
# cost real money once you multiply them by the variant count.
quality: high

# "transparent" needs a png or webp output. If you switch this to "opaque", also
# edit the Background section of references/style.md — the template asks for a
# clean alpha cut-out, and the two have to agree.
background: transparent

# Variations per run, 1-10. They come back from a single API call.
variants: 4

# Downscaled copies written when you keep a variant.
keep_sizes: [512, 256, 128]

bots_file: ./bots.yaml

# The prompt template. Read on every run — this is the steering lever. Its
# [BRACKETED] slots are filled from each bot's entry in bots.yaml. Every path
# here resolves next to this file, so this folder can be moved or copied whole.
style_notes_file: ./style.md

# Example avatars sent to the image model as references. Files are ordered by name
# with numeric prefixes first (01-, 02-, ...), so prefixing controls which ones win.
style_refs_dir: ./style-refs
# The API takes up to 16. More refs means a stronger family signal but slower,
# pricier calls — raise this as you add bots worth matching.
max_style_refs: 6

outputs_dir: ./outputs

# The bounded set of head silhouettes. Variety without losing the family — the
# describer picks from this list and nothing else, so keep it short.
head_options:
  - rounded rectangle        # dependable, general-purpose
  - wide rounded trapezoid   # leadership, coordination
  - tall rounded pill        # publishing and communications
  - circular or domed        # creative and social
  - rounded hexagon          # technical and analytical
  - compact square           # operations and execution
  - horizontal capsule       # monitoring and research

# Fills in a new bot's traits from its name alone. Delete this block to turn
# that off — then every slot has to come from bots.yaml or a --flag.
describer:
  model: claude-opus-5
